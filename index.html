<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Meses del año</title>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">

  <div class="backdrop-blur-xl bg-white/20 border border-white/30 shadow-2xl rounded-3xl p-8 w-96 text-center">

    <h1 class="text-2xl font-bold text-white mb-2">📅 Mes del Año</h1>
    <p class="text-white/80 mb-6">Introduce un número del 1 al 12</p>

    <input 
      id="mesInput"
      type="number"
      min="1"
      max="12"
      class="w-full px-4 py-3 rounded-xl bg-white/90 text-gray-800 outline-none focus:ring-4 focus:ring-white/40 transition"
    />

    <button 
      onclick="mostrarMes()"
      class="w-full mt-4 py-3 rounded-xl bg-white text-purple-700 font-bold hover:scale-105 active:scale-95 transition transform shadow-lg"
    >
      Mostrar mes
    </button>

    <div 
      id="resultado"
      class="mt-6 text-white text-lg font-semibold min-h-[40px] transition-all"
    ></div>

  </div>
    <script src="./app.js"></script>
</body>
</html>
